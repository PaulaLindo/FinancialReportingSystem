{% extends "base.html" %}

{% block title %}Statement review{% endblock %}

{% block content %}
<div class="page page--approvals approval-page approval-page--review-only">
    <div id="statementReviewPanel" class="statement-review-panel" aria-live="polite">
        <div class="container-content statement-review-panel__inner">
            <div class="statement-review-panel__bar">
                <a id="statementReviewBackLink" href="/finance-manager/review-queue" class="btn btn-secondary btn-sm">← Back</a>
            </div>
            <div id="statementReviewContent" class="statement-review-content">
                <div class="approval-empty-state">
                    <div class="approval-empty-icon">📄</div>
                    <h3>Loading statement review…</h3>
                    <p>Open a submission from <strong>Review</strong> or <strong>History</strong>.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
{% if current_user %}
window.currentUserRole = '{{ current_user.role }}';
window.currentUserId = '{{ current_user.id }}';
window.currentUserFullName = '{{ current_user.full_name }}';
{% endif %}
</script>
{% endblock %}
